name: Sync Aiki theme

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: shinyu-aiki-theme-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current Aiki theme from shinyuembody.org
        run: python3 scripts/sync-aiki-theme.py
      - name: Commit theme when it changed
        run: |
          if git diff --quiet -- app-content/aiki-theme.json; then
            echo 'Aiki theme is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-content/aiki-theme.json
          git commit -m 'Sync current Aiki theme from website'
          git push
