name: Build and publish signed Android release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release APK
        shell: bash
        run: gradle --no-daemon --console=plain :app:clean :app:assembleRelease

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/shinyu-release.jks"
          test -s "$RUNNER_TEMP/shinyu-release.jks"

      - name: Align, sign and verify APK
        shell: bash
        env:
          KEYSTORE_PASSWORD_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist

          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD_RAW" | tr -d '\r\n')"

          UNSIGNED="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)"
          if [ -z "$UNSIGNED" ]; then
            echo "Unsigned release APK not found"
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          ALIGNED="$RUNNER_TEMP/Shinyu-Aikido-aligned-unsigned.apk"
          SIGNED="dist/Shinyu-Aikido.apk"

          "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/shinyu-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED" | tee dist/signing-verification.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED"

          {
            echo "SHINYU AIKIDO V1.3.13 SIGNED BUILD VERIFICATION"
            echo
            echo "=== SHA-256 OF SIGNED APK ==="
            sha256sum "$SIGNED"
            echo
            echo "=== PACKAGE AND VERSION ==="
            "$BUILD_TOOLS/aapt2" dump badging "$SIGNED" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|application-debuggable" || true
            echo
            echo "=== REQUESTED PERMISSIONS ==="
            "$BUILD_TOOLS/aapt2" dump permissions "$SIGNED"
            echo
            echo "PASS: APK signed"
            echo "PASS: APK signature verified"
            echo "PASS: APK alignment verified"
          } | tee dist/release-build-verification.txt

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shinyu-Aikido-v1.3.13-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release v1.3.13
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.3.13"
          APK="dist/Shinyu-Aikido.apk"
          NOTES="Signed Android build with improved live Aiki Theme parsing from shinyuembody.org. Because the signing key was reset, users with an older APK signed by the previous key may need to uninstall the old app once before installing this version."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "Shinyu Aikido v1.3.13" \
              --notes "$NOTES"
          fi
