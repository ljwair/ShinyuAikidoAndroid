name: Build and publish signed Android release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK and App Bundle
        shell: bash
        run: gradle --no-daemon --console=plain :app:clean :app:assembleRelease :app:bundleRelease

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/shinyu-release.jks"
          test -s "$RUNNER_TEMP/shinyu-release.jks"

      - name: Sign APK and App Bundle
        shell: bash
        env:
          KEYSTORE_PASSWORD_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_RAW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_RAW" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD_RAW" | tr -d '\r\n')"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)"
          test -n "$UNSIGNED_APK"
          ALIGNED_APK="$RUNNER_TEMP/Shinyu-Aikido-aligned-unsigned.apk"
          SIGNED_APK="dist/Shinyu-Aikido.apk"
          "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/shinyu-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK" | tee dist/apk-signing-verification.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$SIGNED_APK"

          UNSIGNED_AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$UNSIGNED_AAB"
          SIGNED_AAB="dist/Shinyu-Aikido.aab"
          cp "$UNSIGNED_AAB" "$SIGNED_AAB"
          jarsigner \
            -keystore "$RUNNER_TEMP/shinyu-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$SIGNED_AAB" "$KEY_ALIAS"
          jarsigner -verify -verbose -certs "$SIGNED_AAB" | tee dist/aab-signing-verification.txt

          {
            echo "SHINYU AIKIDO GOOGLE PLAY BUILD VERIFICATION"
            sha256sum "$SIGNED_APK" "$SIGNED_AAB"
            "$BUILD_TOOLS/aapt2" dump badging "$SIGNED_APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|application-debuggable" || true
            "$BUILD_TOOLS/aapt2" dump permissions "$SIGNED_APK"
            echo "PASS: APK and AAB signed and verified"
          } | tee dist/release-build-verification.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shinyu-Aikido-Google-Play-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release v1.3.14
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.3.14"
          APK="dist/Shinyu-Aikido.apk"
          AAB="dist/Shinyu-Aikido.aab"
          NOTES="Signed Android build. Includes an Android App Bundle for Google Play closed testing."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --target "$GITHUB_SHA" --title "Shinyu Aikido v1.3.14" --notes "$NOTES"
          fi
